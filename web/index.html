<!doctype html>
<html lang='ja'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>MarkItDown Web</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      color: #333
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3)
    }
    h1 {
      font-size: 36px;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }
    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px
    }
    .mac-app-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
      padding: 24px;
      border-radius: 12px;
      margin: 30px 0;
      border-left: 4px solid #667eea
    }
    .mac-app-card h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #333
    }
    .mac-app-card p {
      margin: 0 0 16px 0;
      color: #555;
      line-height: 1.6
    }
    .mac-app-card .warning {
      font-size: 13px;
      color: #e65100;
      background: #fff3e0;
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px
    }
    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
    }
    section {
      margin: 32px 0;
      padding: 24px;
      background: #f8f9fa;
      border-radius: 12px
    }
    section h2 {
      margin: 0 0 16px 0;
      font-size: 24px;
      color: #333
    }
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.2s
    }
    textarea:focus {
      outline: none;
      border-color: #667eea
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 12px
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
    }
    .error {
      color: #d32f2f;
      margin: 12px 0;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      font-size: 14px
    }
    .icon {
      font-size: 24px;
      margin-right: 8px
    }
    @media (max-width: 600px) {
      .container {
        padding: 24px
      }
      h1 {
        font-size: 28px
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="icon">📝</span>MarkItDown</h1>
    <p class="subtitle">テキストをMarkdownとして保存するか、ファイルをMarkItDownで変換します。</p>
    
    <div class="mac-app-card">
      <h3>📱 macOSアプリも利用可能</h3>
      <p>メニューバーから簡単にファイルを変換できるmacOSアプリもご利用いただけます。</p>
      <a href="https://github.com/rt18formula1/MarkItDown-GUI/releases" target="_blank" class="download-btn">GitHub Releasesからダウンロード</a>
      <div class="warning">⚠️ 注意: このアプリはApple Developer IDで署名されていません。初回起動時にセキュリティ警告が表示される場合があります。その場合は「システム設定」→「プライバシーとセキュリティ」から許可してください。</div>
    </div>
    
    <section>
      <h2>📄 テキスト変換</h2>
      <form id='textForm'>
        <textarea name='text' placeholder='文章を貼り付けてください...'></textarea>
        <button type='submit'>Markdownをダウンロード</button>
      </form>
      <div id='textError' class='error'></div>
    </section>
    
    <section>
      <h2>📁 ファイル変換</h2>
      <form id='fileForm'>
        <input type='file' name='file' required>
        <button type='submit'>変換してダウンロード</button>
      </form>
      <div id='fileError' class='error'></div>
    </section>
  </div>

  <script>
    document.getElementById('textForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = e.target.text.value;
      const errorDiv = document.getElementById('textError');
      errorDiv.textContent = '';
      
      if (!text.trim()) {
        errorDiv.textContent = 'テキストを入力してください';
        return;
      }
      
      try {
        const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pasted-text.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = 'エラー: ' + err.message;
      }
    });

    document.getElementById('fileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = e.target.file.files[0];
      const errorDiv = document.getElementById('fileError');
      errorDiv.textContent = '';
      
      if (!file) {
        errorDiv.textContent = 'ファイルを選択してください';
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const response = await fetch('/.netlify/functions/convert', {
          method: 'POST',
          body: formData
        });
        
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error || '変換に失敗しました');
        }
        
        const markdown = await response.text();
        const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.[^/.]+$/, '') + '.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = 'エラー: ' + err.message;
      }
    });
  </script>
</body>
</html>

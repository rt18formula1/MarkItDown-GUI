<!doctype html>
<html lang='ja'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>MarkItDown Web</title>
  <style>
    body {
      font: 16px system-ui;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 18px;
      color: #202124
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 220px;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 8px
    }
    input, button {
      margin: 10px 0;
      padding: 10px
    }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 6px
    }
    section {
      margin: 24px 0
    }
    h1 {
      font-size: 28px
    }
    .error {
      color: #d32f2f;
      margin: 10px 0
    }
  </style>
</head>
<body>
  <h1>MarkItDown</h1>
  <p>テキストをMarkdownとして保存するか、ファイルをMarkItDownで変換します。</p>
  
  <section style="background: #f5f5f5; padding: 16px; border-radius: 8px; margin: 20px 0;">
    <h3 style="margin-top: 0;">📱 macOSアプリも利用可能</h3>
    <p>メニューバーから簡単にファイルを変換できるmacOSアプリもご利用いただけます。</p>
    <a href="https://github.com/rt18formula1/MarkItDown-GUI/releases" target="_blank" style="display: inline-block; background: #1769aa; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; margin-top: 8px;">GitHub Releasesからダウンロード</a>
    <p style="font-size: 14px; color: #666; margin-top: 12px;">⚠️ 注意: このアプリはApple Developer IDで署名されていません。初回起動時にセキュリティ警告が表示される場合があります。その場合は「システム設定」→「プライバシーとセキュリティ」から許可してください。</p>
  </section>
  
  <section>
    <h2>テキスト</h2>
    <form id='textForm'>
      <textarea name='text' placeholder='文章を貼り付けてください'></textarea><br>
      <button type='submit'>Markdownをダウンロード</button>
    </form>
    <div id='textError' class='error'></div>
  </section>
  
  <section>
    <h2>ファイル</h2>
    <form id='fileForm'>
      <input type='file' name='file' required><br>
      <button type='submit'>変換してダウンロード</button>
    </form>
    <div id='fileError' class='error'></div>
  </section>

  <script>
    document.getElementById('textForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = e.target.text.value;
      const errorDiv = document.getElementById('textError');
      errorDiv.textContent = '';
      
      if (!text.trim()) {
        errorDiv.textContent = 'テキストを入力してください';
        return;
      }
      
      try {
        const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pasted-text.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = 'エラー: ' + err.message;
      }
    });

    document.getElementById('fileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = e.target.file.files[0];
      const errorDiv = document.getElementById('fileError');
      errorDiv.textContent = '';
      
      if (!file) {
        errorDiv.textContent = 'ファイルを選択してください';
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const response = await fetch('/.netlify/functions/convert', {
          method: 'POST',
          body: formData
        });
        
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error || '変換に失敗しました');
        }
        
        const markdown = await response.text();
        const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.[^/.]+$/, '') + '.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = 'エラー: ' + err.message;
      }
    });
  </script>
</body>
</html>

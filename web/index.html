<!doctype html>
<html lang='ja'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>MarkItDown Web</title>
  <link rel='icon' type='image/png' href='favicon.png'>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      color: #333
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3)
    }
    h1 {
      font-size: 36px;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }
    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px
    }
    .mac-app-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
      padding: 24px;
      border-radius: 12px;
      margin: 30px 0;
      border-left: 4px solid #667eea
    }
    .mac-app-card h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #333
    }
    .mac-app-card p {
      margin: 0 0 16px 0;
      color: #555;
      line-height: 1.6
    }
    .mac-app-card .warning {
      font-size: 13px;
      color: #e65100;
      background: #fff3e0;
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px
    }
    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
    }
    section {
      margin: 32px 0;
      padding: 24px;
      background: #f8f9fa;
      border-radius: 12px
    }
    section h2 {
      margin: 0 0 16px 0;
      font-size: 24px;
      color: #333
    }
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.2s
    }
    textarea:focus {
      outline: none;
      border-color: #667eea
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 12px
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
    }
    .error {
      color: #d32f2f;
      margin: 12px 0;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      font-size: 14px
    }
    .icon {
      font-size: 24px;
      margin-right: 8px
    }
    .lang-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #667eea;
      transition: all 0.2s
    }
    .lang-switch:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3)
    }
    .container {
      position: relative
    }
    @media (max-width: 600px) {
      .container {
        padding: 24px
      }
      h1 {
        font-size: 28px
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="lang-switch" id="langSwitch">English</button>
    <h1><span class="icon">📝</span>MarkItDown</h1>
    <p class="subtitle" data-i18n="subtitle">テキストをMarkdownとして保存するか、ファイルをMarkItDownで変換します。</p>
    
    <div class="mac-app-card">
      <h3 data-i18n="mac-app-title">📱 macOSアプリも利用可能</h3>
      <p data-i18n="mac-app-desc">メニューバーから簡単にファイルを変換できるmacOSアプリもご利用いただけます。</p>
      <a href="https://github.com/rt18formula1/MarkItDown-GUI/releases" target="_blank" class="download-btn" data-i18n="download-btn">GitHub Releasesからダウンロード</a>
      <div class="warning" data-i18n="warning">⚠️ 注意: このアプリはApple Developer IDで署名されていません。初回起動時にセキュリティ警告が表示される場合があります。その場合は「システム設定」→「プライバシーとセキュリティ」から許可してください。</div>
    </div>
    
    <section>
      <h2 data-i18n="text-section-title">📄 テキスト変換</h2>
      <form id='textForm'>
        <textarea name='text' data-i18n-placeholder="text-placeholder" placeholder='文章を貼り付けてください...'></textarea>
        <button type='submit' data-i18n="text-submit">Markdownをダウンロード</button>
      </form>
      <div id='textError' class='error'></div>
    </section>
    
    <section>
      <h2 data-i18n="file-section-title">📁 ファイル変換</h2>
      <form id='fileForm'>
        <input type='file' name='file' required>
        <button type='submit' data-i18n="file-submit">変換してダウンロード</button>
      </form>
      <div id='fileError' class='error'></div>
    </section>
  </div>

  <script>
    const translations = {
      ja: {
        'lang-switch': 'English',
        'subtitle': 'テキストをMarkdownとして保存するか、ファイルをMarkItDownで変換します。',
        'mac-app-title': '📱 macOSアプリも利用可能',
        'mac-app-desc': 'メニューバーから簡単にファイルを変換できるmacOSアプリもご利用いただけます。',
        'download-btn': 'GitHub Releasesからダウンロード',
        'warning': '⚠️ 注意: このアプリはApple Developer IDで署名されていません。初回起動時にセキュリティ警告が表示される場合があります。その場合は「システム設定」→「プライバシーとセキュリティ」から許可してください。',
        'text-section-title': '📄 テキスト変換',
        'text-placeholder': '文章を貼り付けてください...',
        'text-submit': 'Markdownをダウンロード',
        'file-section-title': '📁 ファイル変換',
        'file-submit': '変換してダウンロード',
        'error-text': 'テキストを入力してください',
        'error-file': 'ファイルを選択してください',
        'error-prefix': 'エラー: ',
        'error-convert': '変換に失敗しました'
      },
      en: {
        'lang-switch': '日本語',
        'subtitle': 'Save text as Markdown or convert files using MarkItDown.',
        'mac-app-title': '📱 macOS App Also Available',
        'mac-app-desc': 'A macOS app that makes it easy to convert files from the menu bar.',
        'download-btn': 'Download from GitHub Releases',
        'warning': '⚠️ Note: This app is not signed with an Apple Developer ID. You may see a security warning on first launch. If so, please allow it via "System Settings" → "Privacy & Security".',
        'text-section-title': '📄 Text Conversion',
        'text-placeholder': 'Paste your text here...',
        'text-submit': 'Download Markdown',
        'file-section-title': '📁 File Conversion',
        'file-submit': 'Convert and Download',
        'error-text': 'Please enter text',
        'error-file': 'Please select a file',
        'error-prefix': 'Error: ',
        'error-convert': 'Conversion failed'
      }
    };

    let currentLang = 'ja';

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      
      document.getElementById('langSwitch').textContent = t['lang-switch'];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
          el.textContent = t[key];
        }
      });
      
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) {
          el.placeholder = t[key];
        }
      });
    }

    document.getElementById('langSwitch').addEventListener('click', () => {
      setLanguage(currentLang === 'ja' ? 'en' : 'ja');
    });

    document.getElementById('textForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = e.target.text.value;
      const errorDiv = document.getElementById('textError');
      errorDiv.textContent = '';
      
      if (!text.trim()) {
        errorDiv.textContent = translations[currentLang]['error-text'];
        return;
      }
      
      try {
        const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pasted-text.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = translations[currentLang]['error-prefix'] + err.message;
      }
    });

    document.getElementById('fileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = e.target.file.files[0];
      const errorDiv = document.getElementById('fileError');
      errorDiv.textContent = '';
      
      if (!file) {
        errorDiv.textContent = translations[currentLang]['error-file'];
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const response = await fetch('/.netlify/functions/convert', {
          method: 'POST',
          body: formData
        });
        
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error || translations[currentLang]['error-convert']);
        }
        
        const markdown = await response.text();
        const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.[^/.]+$/, '') + '.md';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorDiv.textContent = translations[currentLang]['error-prefix'] + err.message;
      }
    });
  </script>
</body>
</html>
